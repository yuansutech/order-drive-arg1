      <p>今天台里来了个实习生。</p>
      <p>她叫林小满。名字很好听。</p>
      <p>她被分到《菁英会客厅》做场记。我在音控室调试设备的时候，她推门进来，问有没有多的耳机。</p>
      <p>我说有。她拿了一副，说了声谢谢就走了。</p>
      <p>我盯着她背影看了很久。</p>
      <p>不知道为什么，那一刻我忘了自己在调什么。</p>
      <p class="dim" style="margin-top:16px;">— 后来我才知道，3 月 15 日是她第一天来台里。</p>
      <p class="dim">我把这个日期记下来了。</p>
