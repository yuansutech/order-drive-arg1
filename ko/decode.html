<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>해독 도구</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="drive">
  <div class="window">
    <div class="window-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="title">decode.html —— 선모의 해독 도구</div>
    </div>
    <div class="window-body">
      <p class="dim">선모가 만든 작은 도구. 조각들을 조합해 비밀번호를 만든다.</p>
      <p>찾은 숫자 조각들을 입력하세요. 시스템이 조합을 시도합니다.</p>
      <div style="margin:20px 0;">
        <label class="dim" style="display:block;margin-bottom:6px;">조각 1 (일기):</label>
        <input type="text" id="f1" class="puzzle-input" maxlength="4" placeholder="····">
      </div>
      <div style="margin:20px 0;">
        <label class="dim" style="display:block;margin-bottom:6px;">조각 2 (사진):</label>
        <input type="text" id="f2" class="puzzle-input" maxlength="4" placeholder="····">
      </div>
      <div style="margin:20px 0;">
        <label class="dim" style="display:block;margin-bottom:6px;">조각 3 (채팅):</label>
        <input type="text" id="f3" class="puzzle-input" maxlength="4" placeholder="····">
      </div>
      <button class="btn primary" onclick="tryDecode()" style="margin-top:16px;">해독 시도</button>
      <p id="decode-result" style="margin-top:16px;"></p>
      <div class="timetower" style="margin-top:24px;">
        <strong>💡 힌트</strong><br>
        세 개의 조각, 각각 4자리. 모두 일치하면 완전한 비밀번호가 표시됩니다.
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
<script>
function tryDecode() {
  const f1 = document.getElementById('f1').value.trim();
  const f2 = document.getElementById('f2').value.trim();
  const f3 = document.getElementById('f3').value.trim();
  const r = document.getElementById('decode-result');
  if (f1 === '0315' && f2 === '8821' && f3 === '0417') {
    r.innerHTML = '<span style="color:#7ee0ff;">✅ 해독 성공. 완전한 키: <strong>0417-0315-8821</strong></span>';
    saveNote('🔓 해독 성공: 0417-0315-8821');
  } else {
    r.innerHTML = '<span style="color:#ff5f57;">❌ 조각이 일치하지 않습니다. 각 숫자를 확인하세요.</span>';
  }
}
</script>
</body>
</html>
