<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>日记目录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="drive">
  <div class="window">
    <div class="window-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="title">diary/ —— 沈默的日记</div>
    </div>
    <div class="window-body">
      <div class="file-list">
        <div class="file-item" onclick="location.href='diary-01.html'">
          <div class="icon">📄</div>
          <div class="name">diary-01.txt —— 2008-03-15 · 遇见</div>
          <div class="size">2.1 KB</div>
        </div>
        <div class="file-item" onclick="location.href='diary-02.html'">
          <div class="icon">📄</div>
          <div class="name">diary-02.txt —— 2009-04-10 · 她开始查了</div>
          <div class="size">3.4 KB</div>
        </div>
        <div class="file-item locked" id="diary-03">
          <div class="icon">🔒</div>
          <div class="name">diary-03.txt —— 2009-04-17 · 最后一篇</div>
          <div class="size">需要密码</div>
        </div>
      </div>

      <div class="timetower" style="margin-top:20px;">
        <strong>🔑 密码提示</strong><br>
        第三篇日记被加密了。沈默在别的地方留了提示——<br>
        "密码是我们第一次见面的日期，格式 MMDD"
      </div>

      <div class="searchbar">
        <input type="text" placeholder="搜索…" autocomplete="off">
        <button>搜索</button>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const s = getState();
  const el = document.getElementById('diary-03');
  if (s.diaryUnlocked) {
    el.classList.remove('locked');
    el.onclick = () => location.href = 'diary-03.html';
    el.querySelector('.icon').textContent = '📄';
    el.querySelector('.size').textContent = '已解锁';
  } else {
    el.onclick = () => {
      const pwd = prompt('输入密码（4位数字）：');
      if (!pwd) return;
      if (pwd === '0315') {
        setState({ diaryUnlocked: true });
        saveNote('🔓 解锁了第三篇日记，密码：0315（第一次见面日期）');
        location.href = 'diary-03.html';
      } else {
        alert('密码错误。');
      }
    };
  }
});
</script>
</body>
</html>
